<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Full-bleed background so the icon works as `maskable` (the disc sits
       inside the central 80% safe zone). Colours are baked literals — a
       manifest icon can't read CSS vars. Mirrors components/BrandMark.tsx. -->
  <rect width="512" height="512" fill="#0e0e0e"/>
  <circle cx="256" cy="256" r="170" fill="#1a1a1a"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="4"/>
  <circle cx="256" cy="256" r="88" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="4"/>
  <circle cx="256" cy="256" r="62" fill="#f0a020"/>
  <circle cx="256" cy="256" r="8" fill="#0e0e0e"/>
</svg>
