# Sample gateway config. Copy to a real path (e.g. `gateway.toml` in the
# repo root, or `~/.config/crates-music/gateway.toml`) and edit the
# fields marked CHANGE-ME.

[server]
listen       = "0.0.0.0:8443"
tls_cert     = "certs/gateway.local.pem"      # produced by ./scripts/dev-certs.sh
tls_key      = "certs/gateway.local-key.pem"
# Static legacy bearer used by the CLI until P4 moves it to OAuth. Pick
# anything random; `openssl rand -hex 32` works.
bearer_token = "CHANGE-ME-to-a-32-byte-random-string"

[upstream]
# Where your Navidrome lives.
navidrome_url = "http://nav.lan:4533"          # CHANGE-ME
username      = "alice"                         # CHANGE-ME
password      = "wonderland"                    # CHANGE-ME

[cache]
path                = "gateway-cache.sqlite"
browse_ttl_seconds  = 86400                    # 24 h

[oauth]
state_db = "gateway-state.sqlite"

# Pre-declared OAuth clients. Registered at startup if not already in
# the DB. The web app expects client_id = "web". Add the localhost
# redirect for the Vite dev server, plus the production same-origin
# redirect for when the gateway eventually serves the SPA itself.
[[oauth.clients]]
client_id     = "web"
name          = "Web"
redirect_uris = [
    "http://localhost:5173/oauth/callback",
    "https://gateway.local:8443/oauth/callback",
]

# The CLI authenticates with the Device Authorization Grant (RFC 8628):
# it has no redirect URI (it can't host one), so the list is empty. The
# CLI prints a short code, you approve it in a logged-in browser, and it
# receives a per-device refresh token. Run `music auth login` to start.
[[oauth.clients]]
client_id     = "cli"
name          = "CLI"
redirect_uris = []

# Optional recommender embedder sidecar. Omit the whole section to run the
# recommender in tag-only degraded mode.
# [embedder]
# # Primary endpoint, tried first. On a split-host setup this is the GPU box.
# url = "http://gpu-box.lan:9000"
# # Failover endpoints, tried in order after `url` when the primary is
# # unreachable — e.g. a CPU sidecar a watchdog brings up on the gateway
# # host (see docker-compose.embedder-failover.yml). The gateway re-probes
# # the whole list in the background and switches the active endpoint with
# # no restart. Every endpoint must serve the SAME model_version + dim
# # (same checkpoint), or its vectors aren't comparable in the shared ANN.
# fallback_urls = ["http://embedder-fallback:9000"]
# # Background re-probe cadence (seconds). 0 disables the loop (boot-time
# # probe only — the legacy behaviour). Default 20.
# probe_interval_seconds = 20
# # Per-request timeout. CPU inference of a 120 s clip can take 10+ s.
# timeout_seconds = 30
# # Shared bearer for split-host deploys; must match the embedder's
# # EMBEDDER_BEARER_TOKEN. Applies to the primary and all fallbacks.
# # bearer_token = "CHANGE-ME"
