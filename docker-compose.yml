# Two-container deploy: gateway (Rust + SPA) and embedder (Python).
#
# Bring up the stack:
#
#   cp docker/.env.example .env   # fill in NAVIDROME_* values
#   docker compose up --build
#
# First boot prints a one-time setup URL in the gateway logs; visit it
# from a browser to set the master password, then sign in to the web
# app at https://gateway.local:8443 (or whatever GATEWAY_HOSTNAME points
# at — add a /etc/hosts entry on each client device).

services:
  gateway:
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
    image: crates-music/gateway:dev
    container_name: crates-gateway
    environment:
      # Required.
      NAVIDROME_URL: ${NAVIDROME_URL:?set NAVIDROME_URL in .env}
      NAVIDROME_USERNAME: ${NAVIDROME_USERNAME:?set NAVIDROME_USERNAME in .env}
      NAVIDROME_PASSWORD: ${NAVIDROME_PASSWORD:?set NAVIDROME_PASSWORD in .env}
      # Internal DNS — embedder is the service name on the compose network.
      EMBEDDER_URL: http://embedder:9000
      # Defaults are sensible; override if you front this with a real domain.
      OAUTH_WEB_REDIRECT_URIS: ${OAUTH_WEB_REDIRECT_URIS:-https://gateway.local:8443/oauth/callback}
      GATEWAY_HOSTNAME: ${GATEWAY_HOSTNAME:-gateway.local}
      RUST_LOG: ${RUST_LOG:-info,music_gateway=info,sqlx=warn}
    volumes:
      - gw-data:/data
    ports:
      - "${GATEWAY_PORT:-8443}:8443"
    depends_on:
      embedder:
        condition: service_healthy
    restart: unless-stopped

  embedder:
    build:
      context: .
      dockerfile: docker/embedder/Dockerfile
    image: crates-music/embedder:dev
    container_name: crates-embedder
    environment:
      # `stub` = deterministic hash vectors, no GPU. Switch to `clap`
      # once the CLAP-variant Dockerfile lands (Phase B).
      EMBEDDER_BACKEND: ${EMBEDDER_BACKEND:-stub}
    # Shares the gateway's persistent volume so the embedder can open
    # `/data/state/gateway-state.recommend.sqlite` directly to write
    # UMAP projection rows (auto_projection task in the gateway calls
    # /reduce with this absolute path). Both containers run as uid
    # 10001 so the embedder can read+write what the gateway created.
    volumes:
      - gw-data:/data
    expose:
      - "9000"
    restart: unless-stopped

  # Minimal Navidrome stand-in for the smoke test. Returns just enough
  # JSON for `Subsonic::ping` to succeed so `/readyz` can flip healthy
  # in CI without provisioning a real Navidrome. Real deploys leave
  # `NAVIDROME_URL` pointing at the actual server; this service stays
  # asleep because no profile is active by default.
  navidrome-stub:
    image: python:3.12-slim
    profiles: ["smoke"]
    container_name: crates-navidrome-stub
    command:
      - python3
      - -c
      - |
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
        class H(BaseHTTPRequestHandler):
            def do_GET(self):
                if self.path.startswith('/rest/ping'):
                    body = b'{"subsonic-response":{"status":"ok","version":"1.16.1"}}'
                    self.send_response(200)
                    self.send_header('Content-Type', 'application/json')
                    self.send_header('Content-Length', str(len(body)))
                    self.end_headers()
                    self.wfile.write(body)
                else:
                    self.send_response(404); self.end_headers()
            def log_message(self, *a, **k): pass
        ThreadingHTTPServer(('0.0.0.0', 4533), H).serve_forever()
    expose:
      - "4533"
    restart: unless-stopped

volumes:
  # Single named volume holds everything the gateway needs to persist:
  # state SQLite DBs, generated certs, audio cache, generated config.
  # The embedder also mounts it (read+write) so the UMAP reducer can
  # write projection rows directly into `gateway-state.recommend.sqlite`
  # — both containers must therefore run as the same numeric uid
  # (pinned to 10001 in their Dockerfiles).
  gw-data:
