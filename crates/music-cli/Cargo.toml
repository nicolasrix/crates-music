[package]
name = "music-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "music_cli"
path = "src/lib.rs"

[[bin]]
name = "crates-cli"
path = "src/main.rs"

[dependencies]
music-core = { workspace = true }
music-subsonic = { workspace = true }
music-cache = { workspace = true }
music-player = { workspace = true }
music-sync = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
directories = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time", "sync"] }
tokio-tungstenite = { workspace = true, features = ["connect", "rustls-tls-native-roots"] }
ratatui = { workspace = true }
crossterm = { workspace = true }
unicode-segmentation = { workspace = true }
owo-colors = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
futures-util = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
