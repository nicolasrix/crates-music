[project]
name = "music-embedder"
version = "0.1.0"
description = "CLAP-based audio + text embedding sidecar for the crates-music gateway."
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "numpy>=1.26",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
# Real CLAP backend — large download, requires PyTorch + AMD ROCm wheels for
# GPU. Kept optional so the dev/test loop doesn't pull this in.
clap = [
    "torch>=2.4",
    "torchaudio>=2.4",
    "torchvision>=0.19",
    # Direct-listed only so the rocm-index source override below fires
    # for it (uv's [tool.uv.sources] doesn't apply to purely transitive
    # deps). Linux-gated because non-Linux platforms get CPU torch
    # without this triton variant.
    "pytorch-triton-rocm; sys_platform == 'linux'",
    "laion-clap>=1.1.6",
    "librosa>=0.10",
    "soundfile>=0.12",
]
dev = [
    "pytest>=8.3",
    "pytest-benchmark>=4.0",
    "httpx>=0.27",
]
# UMAP 2-D reduction for the latent-space view in the diagnostics page.
# Used by `embedder.reduce` only — not loaded by the FastAPI service.
# Pulls in numba + scipy + sklearn so kept optional.
reduce = [
    "umap-learn>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["embedder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Skip benchmarks during a normal `pytest` run — they auto-calibrate
# iteration counts and the 5MB-audio case alone takes ~2 s. Run them
# explicitly with `pytest -m benchmark` (the last `-m` on the command
# line wins, so this default is overridable).
addopts = "-q -m 'not benchmark'"
markers = [
    "benchmark: performance benchmarks; opt-in via `pytest -m benchmark`",
]
filterwarnings = [
    "ignore::DeprecationWarning:pytest_benchmark.*",
]

# AMD ROCm-built PyTorch wheels.
#
# Without this, uv pulls torch from PyPI's default index, which ships
# CUDA-13 wheels — useless on AMD hardware (~6 GB of nvidia-* libs sit
# idle and torch.cuda.is_available() returns False).
#
# Path picked: stable rocm6.4 (torch 2.9.0). Our system ROCm is 7.2.2,
# but PyTorch wheels bundle their own ROCm runtime so kernel-driver
# forward compatibility is what matters at the OS layer. If RDNA4
# (gfx1201) kernel coverage in rocm6.4 wheels turns out to be
# incomplete on RDNA4, switch the index URL below to
# `https://download.pytorch.org/whl/nightly/rocm7.0` — same shape, no
# other code changes needed. Phase-1 device-field on /healthz tells us
# which path we're on.
#
# Marker `sys_platform == 'linux'` keeps non-Linux dev installs (CI,
# macOS) on the default PyPI source. Pinning is `explicit = true` so
# only the listed packages route here; everything else still resolves
# via PyPI normally.
[tool.uv.sources]
torch = [{ index = "pytorch-rocm", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-rocm", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-rocm", marker = "sys_platform == 'linux'" }]
# torch's transitive triton dep also lives on the ROCm index (it has a
# different build flavour than upstream `triton`). Route it explicitly
# or the resolver fails with "no version of pytorch-triton-rocm…".
pytorch-triton-rocm = [{ index = "pytorch-rocm", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.4"
explicit = true
