<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="height:170px">
<div class="card-grid">
  <div class="label">Corner radii</div>
  <div class="row" style="gap:18px">
    <div class="col" style="align-items:center;gap:6px"><div style="width:64px;height:64px;background:var(--surface-2);border-radius:0"></div><div class="token-name">--radius-0</div><div class="token">tables</div></div>
    <div class="col" style="align-items:center;gap:6px"><div style="width:64px;height:64px;background:var(--surface-2);border-radius:4px"></div><div class="token-name">--radius-1</div><div class="token">pills</div></div>
    <div class="col" style="align-items:center;gap:6px"><div style="width:64px;height:64px;background:var(--surface-2);border-radius:6px"></div><div class="token-name">--radius-2</div><div class="token">buttons</div></div>
    <div class="col" style="align-items:center;gap:6px"><div style="width:64px;height:64px;background:var(--surface-2);border-radius:10px"></div><div class="token-name">--radius-3</div><div class="token">cards/covers</div></div>
    <div class="col" style="align-items:center;gap:6px"><div style="width:64px;height:64px;background:var(--surface-2);border-radius:16px"></div><div class="token-name">--radius-4</div><div class="token">hero/modal</div></div>
    <div class="col" style="align-items:center;gap:6px"><div style="width:64px;height:64px;background:var(--accent);border-radius:9999px"></div><div class="token-name">--radius-full</div><div class="token">play btn</div></div>
  </div>
</div>
</body></html>
