<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.field { display:flex; flex-direction:column; gap:6px; }
.field input, .field select {
  background: var(--surface-1); color: var(--fg); border: 1px solid var(--border-subtle);
  padding: 9px 12px; border-radius: var(--radius-2); font: var(--type-ui);
  outline: none; transition: border-color var(--dur-1), background var(--dur-1);
}
.field input:focus, .field select:focus { border-color: var(--accent); background: var(--surface-2); }
.field input.search { padding-left: 32px; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='rgba(180,170,150,0.7)' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='7'/><path d='m20 20-3.5-3.5'/></svg>"); background-repeat:no-repeat; background-position: 10px center; }
</style>
</head>
<body style="height:220px">
<div class="card-grid">
  <div class="label">Form inputs</div>
  <div class="row" style="gap:14px">
    <div class="field" style="flex:2"><span class="token-name">search</span><input class="search" placeholder="search albums, artists, tracks…"></div>
    <div class="field" style="flex:1"><span class="token-name">text</span><input value="My fall mix"></div>
  </div>
  <div class="row" style="gap:14px">
    <div class="field" style="flex:1"><span class="token-name">select</span>
      <select><option>Newest</option><option>A → Z</option><option>Most played</option></select>
    </div>
    <div class="field" style="flex:2"><span class="token-name">disabled</span><input value="bearer_token = ********" disabled style="opacity:.5"></div>
  </div>
</div>
</body></html>
