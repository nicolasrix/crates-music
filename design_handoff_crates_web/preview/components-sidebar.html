<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.nav { background: var(--surface-1); border-radius: var(--radius-3); padding: 12px; width: 240px; }
.nav .group { color: var(--fg-faint); font: var(--type-label); text-transform: uppercase; letter-spacing: 0.04em; padding: 8px 10px 6px; }
.nav a { display:flex; align-items:center; gap: 10px; padding: 7px 10px; border-radius: var(--radius-1); color: var(--fg-muted); font: var(--type-ui); text-decoration: none; transition: background var(--dur-1), color var(--dur-1); }
.nav a:hover { color: var(--fg); background: var(--surface-2); }
.nav a.active { color: var(--fg); background: var(--surface-2); position:relative; }
.nav a.active::before { content:""; position:absolute; left: -12px; top: 6px; bottom: 6px; width: 2px; background: var(--accent); border-radius: 999px; }
.svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
</style></head>
<body style="height:300px">
<div class="card-grid">
  <div class="label">Sidebar nav · 240px · active = surface-2 + 2px amber rule</div>
  <div class="row" style="gap:18px;align-items:stretch">
    <nav class="nav">
      <div class="group">browse</div>
      <a class="active"><svg class="svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>albums</a>
      <a><svg class="svg" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>artists</a>
      <a><svg class="svg" viewBox="0 0 24 24"><path d="M21 15V6"/><path d="M18.5 18a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0Z"/><path d="M12 12H3"/><path d="M16 6H3"/><path d="M12 18H3"/></svg>tracks</a>
      <div class="group" style="margin-top:6px">playlists</div>
      <a><svg class="svg" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg>new playlist</a>
      <a>late nights</a>
      <a>kitchen + coffee</a>
    </nav>
    <div class="col" style="flex:1;gap:6px">
      <div class="token-name">a.active</div>
      <div class="token">color: --fg · bg: --surface-2 · 2px --accent rule (left, inset 6px)</div>
      <div class="token-name" style="margin-top:6px">a:hover</div>
      <div class="token">color: --fg · bg: --surface-2</div>
      <div class="token-name" style="margin-top:6px">a (rest)</div>
      <div class="token">color: --fg-muted · bg: transparent</div>
    </div>
  </div>
</div>
</body></html>
