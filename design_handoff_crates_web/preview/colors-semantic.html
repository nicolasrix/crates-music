<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="height:180px">
<div class="card-grid">
  <div class="label">Semantic state · success · warning · danger · info</div>
  <div class="row" style="gap:14px">
    <div class="col" style="flex:1;align-items:center"><div class="swatch" style="background:var(--success)"></div><div class="token-name">--success</div><div class="token">155° / 0.16</div></div>
    <div class="col" style="flex:1;align-items:center"><div class="swatch" style="background:var(--warning)"></div><div class="token-name">--warning</div><div class="token">80° / 0.15</div></div>
    <div class="col" style="flex:1;align-items:center"><div class="swatch" style="background:var(--danger)"></div><div class="token-name">--danger</div><div class="token">25° / 0.21</div></div>
    <div class="col" style="flex:1;align-items:center"><div class="swatch" style="background:var(--info)"></div><div class="token-name">--info</div><div class="token">230° / 0.13</div></div>
  </div>
</div>
</body></html>
