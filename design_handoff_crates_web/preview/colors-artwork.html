<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="height:230px">
<div class="card-grid">
  <div class="label">Artwork-derived palette · per-page tint extracted from cover</div>
  <div class="row" style="gap:12px">
    <!-- Page A: warm orange album -->
    <div style="flex:1;border-radius:var(--radius-3);padding:14px;background:#3A1F0E;color:#F4D9B7;--art-accent:#E8A96A">
      <div style="font:var(--type-meta);opacity:.7">album page</div>
      <div style="font-family:var(--font-display);font-size:22px;font-weight:500;margin-top:4px">Bitches Brew</div>
      <div style="margin-top:10px;display:flex;gap:6px"><span style="background:#3A1F0E;width:18px;height:18px;border-radius:4px;border:1px solid rgba(255,255,255,.2)"></span><span style="background:#F4D9B7;width:18px;height:18px;border-radius:4px"></span><span style="background:#9A6B3F;width:18px;height:18px;border-radius:4px"></span><span style="background:#E8A96A;width:18px;height:18px;border-radius:4px"></span></div>
    </div>
    <!-- Page B: cool blue album -->
    <div style="flex:1;border-radius:var(--radius-3);padding:14px;background:#0F2236;color:#C8DAEC;--art-accent:#5B8FB9">
      <div style="font:var(--type-meta);opacity:.7">album page</div>
      <div style="font-family:var(--font-display);font-size:22px;font-weight:500;margin-top:4px">Blue Train</div>
      <div style="margin-top:10px;display:flex;gap:6px"><span style="background:#0F2236;width:18px;height:18px;border-radius:4px;border:1px solid rgba(255,255,255,.2)"></span><span style="background:#C8DAEC;width:18px;height:18px;border-radius:4px"></span><span style="background:#3E6B92;width:18px;height:18px;border-radius:4px"></span><span style="background:#5B8FB9;width:18px;height:18px;border-radius:4px"></span></div>
    </div>
    <!-- Page C: green album -->
    <div style="flex:1;border-radius:var(--radius-3);padding:14px;background:#1B2A1A;color:#D6E5C8;--art-accent:#A8C26B">
      <div style="font:var(--type-meta);opacity:.7">album page</div>
      <div style="font-family:var(--font-display);font-size:22px;font-weight:500;margin-top:4px">Pet Sounds</div>
      <div style="margin-top:10px;display:flex;gap:6px"><span style="background:#1B2A1A;width:18px;height:18px;border-radius:4px;border:1px solid rgba(255,255,255,.2)"></span><span style="background:#D6E5C8;width:18px;height:18px;border-radius:4px"></span><span style="background:#5E7A4A;width:18px;height:18px;border-radius:4px"></span><span style="background:#A8C26B;width:18px;height:18px;border-radius:4px"></span></div>
    </div>
  </div>
  <div class="token">--art-bg · --art-fg · --art-mute · --art-accent · set on &lt;main&gt;, fall back to chrome</div>
</div>
</body></html>
