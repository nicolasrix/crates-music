<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="height:170px">
<div class="card-grid">
  <div class="label">Surface scale · light · warm paper</div>
  <div class="row" style="gap:0;border-radius:var(--radius-2);overflow:hidden;border:1px solid var(--border-subtle)">
    <div style="background:var(--surface-0);width:25%;height:64px;display:flex;align-items:flex-end;padding:6px;color:var(--fg-muted);font:var(--type-mono);font-size:10px">surface-0</div>
    <div style="background:var(--surface-1);width:25%;height:64px;display:flex;align-items:flex-end;padding:6px;color:var(--fg-muted);font:var(--type-mono);font-size:10px">surface-1</div>
    <div style="background:var(--surface-2);width:25%;height:64px;display:flex;align-items:flex-end;padding:6px;color:var(--fg-muted);font:var(--type-mono);font-size:10px">surface-2</div>
    <div style="background:var(--surface-3);width:25%;height:64px;display:flex;align-items:flex-end;padding:6px;color:var(--fg-muted);font:var(--type-mono);font-size:10px">surface-3</div>
  </div>
  <div class="row" style="font:var(--type-meta);color:var(--fg-muted)">page bg · cards · hover/raised · popovers</div>
</div>
</body></html>
