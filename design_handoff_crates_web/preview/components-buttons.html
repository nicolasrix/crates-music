<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="height:230px">
<div class="card-grid">
  <div class="label">Buttons</div>
  <div class="row" style="gap:10px">
    <button class="btn btn-primary">Play album</button>
    <button class="btn">Add to playlist</button>
    <button class="btn btn-ghost">Cancel</button>
    <button class="btn" disabled style="opacity:.4;cursor:not-allowed">Loading…</button>
  </div>
  <div class="row" style="gap:10px;align-items:center">
    <button class="btn btn-primary" style="padding:6px 10px;font-size:13px">small</button>
    <button class="btn btn-primary">default</button>
    <button class="btn btn-primary" style="padding:11px 18px;font-size:16px">large</button>
    <span class="token" style="margin-left:auto">--btn (32 / 36 / 44)</span>
  </div>
  <div class="row" style="gap:10px">
    <button class="btn" style="width:36px;height:36px;padding:0;border-radius:var(--radius-2);justify-content:center">+</button>
    <button class="btn" style="width:36px;height:36px;padding:0;border-radius:var(--radius-2);justify-content:center">···</button>
    <button class="btn btn-primary" style="width:56px;height:56px;padding:0;border-radius:var(--radius-full);justify-content:center;font-size:22px">▶</button>
    <span class="token" style="margin-left:auto">icon-only · 36 / 36 / 56 (player)</span>
  </div>
</div>
</body></html>
