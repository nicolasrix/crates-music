<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="height:200px">
<div class="card-grid">
  <div class="label">Elevation · only two shadows</div>
  <div class="row" style="gap:32px;padding:16px 8px 24px">
    <div class="col" style="align-items:center;gap:10px;flex:1">
      <div style="width:120px;height:84px;background:var(--surface-1);border-radius:var(--radius-3);box-shadow:var(--shadow-pop)"></div>
      <div class="token-name">--shadow-pop</div>
      <div class="token" style="text-align:center">hover-raised cards · dropdowns · scrub thumb</div>
    </div>
    <div class="col" style="align-items:center;gap:10px;flex:1">
      <div style="width:160px;height:84px;background:var(--surface-1);border-radius:var(--radius-3) var(--radius-3) 0 0;box-shadow:var(--shadow-overlay);position:relative">
        <div style="position:absolute;top:0;left:0;right:0;height:1px;background:var(--border-subtle)"></div>
      </div>
      <div class="token-name">--shadow-overlay</div>
      <div class="token" style="text-align:center">player bar · modals · top hairline + bleed</div>
    </div>
  </div>
</div>
</body></html>
