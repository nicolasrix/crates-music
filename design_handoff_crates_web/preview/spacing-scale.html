<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="height:200px">
<div class="card-grid">
  <div class="label">Spacing scale · 8px base</div>
  <div class="row" style="align-items:flex-end;gap:10px">
    <div class="col" style="align-items:center;gap:4px"><div style="width:4px;height:4px;background:var(--accent)"></div><div class="token">1·4</div></div>
    <div class="col" style="align-items:center;gap:4px"><div style="width:8px;height:8px;background:var(--accent)"></div><div class="token">2·8</div></div>
    <div class="col" style="align-items:center;gap:4px"><div style="width:12px;height:12px;background:var(--accent)"></div><div class="token">3·12</div></div>
    <div class="col" style="align-items:center;gap:4px"><div style="width:16px;height:16px;background:var(--accent)"></div><div class="token">4·16</div></div>
    <div class="col" style="align-items:center;gap:4px"><div style="width:24px;height:24px;background:var(--accent)"></div><div class="token">5·24</div></div>
    <div class="col" style="align-items:center;gap:4px"><div style="width:32px;height:32px;background:var(--accent)"></div><div class="token">6·32</div></div>
    <div class="col" style="align-items:center;gap:4px"><div style="width:48px;height:48px;background:var(--accent)"></div><div class="token">7·48</div></div>
    <div class="col" style="align-items:center;gap:4px"><div style="width:64px;height:64px;background:var(--accent)"></div><div class="token">8·64</div></div>
    <div class="col" style="align-items:center;gap:4px"><div style="width:96px;height:96px;background:var(--accent)"></div><div class="token">9·96</div></div>
  </div>
</div>
</body></html>
