<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="height:170px">
<div class="card-grid">
  <div class="label">Ink scale · dark · OKLCH-spaced</div>
  <div class="row" style="gap:0;border-radius:var(--radius-2);overflow:hidden">
    <div style="background:var(--ink-50);width:9.09%;height:64px"></div>
    <div style="background:var(--ink-100);width:9.09%;height:64px"></div>
    <div style="background:var(--ink-200);width:9.09%;height:64px"></div>
    <div style="background:var(--ink-300);width:9.09%;height:64px"></div>
    <div style="background:var(--ink-400);width:9.09%;height:64px"></div>
    <div style="background:var(--ink-500);width:9.09%;height:64px"></div>
    <div style="background:var(--ink-600);width:9.09%;height:64px"></div>
    <div style="background:var(--ink-700);width:9.09%;height:64px"></div>
    <div style="background:var(--ink-800);width:9.09%;height:64px"></div>
    <div style="background:var(--ink-900);width:9.09%;height:64px"></div>
    <div style="background:var(--ink-950);width:9.09%;height:64px"></div>
  </div>
  <div class="row" style="gap:0;justify-content:space-between;font:var(--type-mono);font-size:10px;color:var(--fg-faint)">
    <span>50</span><span>100</span><span>200</span><span>300</span><span>400</span><span>500</span><span>600</span><span>700</span><span>800</span><span>900</span><span>950</span>
  </div>
</div>
</body></html>
